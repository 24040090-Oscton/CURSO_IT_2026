<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjeta de Presentación</title>
  <!-- Fuentes e iconos de Google Font y FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #fff;
    }

    /* Contenedor de la tarjeta */
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 320px;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* Efecto al pasar el cursor */
    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    /* Foto de perfil */
    .profile-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
      border: 3px solid #38bdf8;
      padding: 3px;
    }

    /* Nombre y título */
    .name {
      font-size: 1.4rem;
      font-weight: 600;
      color: #f8fafc;
    }

    .title {
      font-size: 0.9rem;
      color: #38bdf8;
      font-weight: 300;
      margin-bottom: 15px;
    }

    /* Descripción corta */
    .bio {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    /* Iconos y redes sociales */
    .social-links {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .social-links a {
      color: #f8fafc;
      font-size: 1.2rem;
      width: 40px;
      height: 40px;
      line-height: 40px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      text-decoration: none;
      transition: background 0.3s, color 0.3s;
    }

    .social-links a:hover {
      background: #38bdf8;
      color: #0f172a;
    }

    /* Botón de contacto */
    .btn-contact {
      display: inline-block;
      width: 100%;
      padding: 10px 0;
      background: #38bdf8;
      color: #0f172a;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 25px;
      transition: background 0.3s, transform 0.2s;
    }

    .btn-contact:hover {
      background: #0284c7;
      color: #fff;
    }
  </style>
</head>
<img>

  <div class="card">
    <!-- Cambia la URL por tu propia foto -->
    <img src="neco.jpg" alt="Foto de Perfil" class="profile-img">
    
    <h2 class="name">Alex de Luna</h2>
    <p class="title">Estudiante de la UTC</p>
    <p class="bio">Amante de comer y dormir, pero sobretodo del dinero</p>
  </div>
     <img src="Jester.gif" alt="gato chistoso">
</body>
</html>
